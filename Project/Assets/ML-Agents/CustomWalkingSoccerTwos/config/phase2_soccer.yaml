# Phase 2: full 3v3 Walker Soccer using MA-POCA and self-play.
# Update init_path to the best checkpoint produced by Phase 1 before running.

behaviors:
  SoccerTwos:
    # Example: results/WalkerBalancePretrain/WalkerBalancePretrain
    init_path: results/WalkerBalancePretrain/WalkerBalancePretrain
    trainer_type: poca
    hyperparameters:
      batch_size: 8192
      buffer_size: 81920
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 30000000
    time_horizon: 64
    summary_freq: 50000
    self_play:
      save_steps: 50000
      team_change: 100000
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

environment_parameters:
  ball_touch:
    curriculum:
      - name: Lesson0
        completion_criteria:
          measure: progress
          behavior: SoccerTwos
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.1
        value: 2.0
      - name: Lesson1
        completion_criteria:
          measure: progress
          behavior: SoccerTwos
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.3
        value: 0.5
      - name: Lesson2
        value: 0.1

# Phase 1: balance and locomotion pretraining for Walker agents.
# Use this file while the scene has no soccer ball/goals (or disable their rewards) and
# set each agent's Behavior Name to "WalkerBalancePretrain".

behaviors:
  WalkerBalancePretrain:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 3
    max_steps: 10000000 # 10million steps
    time_horizon: 64
    summary_freq: 20000

environment_parameters:
  # Keep ball_touch at 0 so agents focus on balance rather than kicking.
  ball_touch:
    sampler_type: constant
    sampler_parameters:
      value: 0.0

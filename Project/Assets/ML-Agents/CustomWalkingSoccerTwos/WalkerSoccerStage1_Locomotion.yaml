# Walker Soccer - Stage 1: Locomotion Training (269 obs)
# Soccer observations are zero-filled during Stage 1 (network learns to ignore them)
# Train with PPO, then transfer to Stage 2

behaviors:
    WalkerSoccer: # Behavior name used for transfer learning
        trainer_type: ppo # Single-agent PPO

        hyperparameters:
            # Learning rate schedule
            learning_rate: 0.0003
            learning_rate_schedule: constant

            # Batch and buffer sizes
            batch_size: 8192
            buffer_size: 81920

            # PPO-specific parameters
            beta: 0.005 # Entropy coefficient (exploration)
            epsilon: 0.2 # PPO clipping
            lambd: 0.95 # GAE lambda
            num_epoch: 3 # Number of passes through experience

        # Neural network architecture
        network_settings:
            normalize: true # Normalize observations
            hidden_units: 512 # Large network for complex walker control
            num_layers: 3 # Deep network for learning locomotion
            vis_encode_type: simple

        # Reward signals
        reward_signals:
            extrinsic:
                gamma: 0.99 # Discount factor
                strength: 1.0

        # Training configuration
        max_steps: 30000000 # 30M steps for Stage 1 locomotion training
        time_horizon: 1000
        summary_freq: 10000
        keep_checkpoints: 5
        checkpoint_interval: 500000

# Environment parameters for Stage 1
environment_parameters:
    # MODE: Locomotion only (269 obs with soccer features zeroed)
    locomotion_only:
        sampler_type: constant
        sampler_parameters:
            value: 1.0 # Enable locomotion-only mode (soccer observations = zero)

    # Randomize walking speed each episode
    target_walking_speed:
        sampler_type: uniform
        sampler_parameters:
            min_value: 0.8
            max_value: 4.0

    # No ball interaction in Stage 1
    ball_touch:
        sampler_type: constant
        sampler_parameters:
            value: 0.0

    # Ball spawns far (agents walk to target sphere instead)
    ball_spawn_radius:
        sampler_type: constant
        sampler_parameters:
            value: 5.0

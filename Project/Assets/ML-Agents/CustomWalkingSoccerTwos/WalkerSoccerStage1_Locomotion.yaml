# Walker Soccer - Stage 1: Locomotion Training (269 obs)
# Soccer observations set to zero during Stage 1 (network learns to ignore them)
# Train with PPO for faster learning, then transfer to Stage 2

behaviors:
    WalkerSoccer: # Same behavior name for transfer learning
        trainer_type: ppo # Single-agent PPO (not POCA)

        hyperparameters:
            # Learning rate schedule
            learning_rate: 0.0003
            learning_rate_schedule: constant

            # Batch and buffer sizes (smaller batch for quicker posture/fall feedback)
            batch_size: 4096
            buffer_size: 40960

            # PPO-specific parameters
            beta: 0.01 # Higher entropy early to explore recovery strategies
            epsilon: 0.2 # PPO clipping
            lambd: 0.95 # GAE lambda
            num_epoch: 3 # Number of passes through experience

        # Neural network architecture
        network_settings:
            normalize: true # Normalize observations
            hidden_units: 512 # Large network for complex walker control
            num_layers: 3 # Deep network for learning locomotion
            vis_encode_type: simple

        # Reward signals
        reward_signals:
            extrinsic:
                gamma: 0.99 # Discount factor
                strength: 1.0

        # Training configuration
        max_steps: 40000000 # 30-40M steps for solid locomotion
        time_horizon: 256 # Shorter horizon: faster credit assignment for stand-up events
        summary_freq: 10000
        keep_checkpoints: 50
        checkpoint_interval: 1000000

# Environment parameters for Stage 1
environment_parameters:
    # STAGE 1 MODE: Locomotion only (269 obs with 26 soccer obs zeroed)
    locomotion_only:
        sampler_type: constant
        sampler_parameters:
            value: 1.0 # Enable locomotion-only mode (soccer observations = zero)

    # Randomize walking speed each episode
    target_walking_speed:
        sampler_type: uniform
        sampler_parameters:
            min_value: 0.8
            max_value: 4.0

    # No ball interaction in Stage 1
    ball_touch:
        sampler_type: constant
        sampler_parameters:
            value: 0.0

    # No ball spawning in Stage 1
    ball_spawn_radius:
        sampler_type: constant
        sampler_parameters:
            value: 0.0

# Walker Soccer - Stage 2: Soccer with Transfer Learning (250 obs)
# Soccer observations now contain real data (ball position, velocity, team)
# Transfer locomotion skills from Stage 1, then learn multi-agent soccer

behaviors:
    WalkerSoccer: # Same behavior name for transfer learning
        trainer_type: poca # Multi-agent POCA

        hyperparameters:
            # Lower learning rate for fine-tuning transferred weights
            learning_rate: 0.0001
            learning_rate_schedule: constant

            # Batch and buffer sizes
            batch_size: 2048
            buffer_size: 20480

            # PPO-specific parameters
            beta: 0.005 # Entropy coefficient
            epsilon: 0.2 # PPO clipping
            lambd: 0.95 # GAE lambda
            num_epoch: 3

        # Neural network architecture (matches Stage 1)
        network_settings:
            normalize: true
            hidden_units: 512
            num_layers: 3
            vis_encode_type: simple

        # Reward signals
        reward_signals:
            extrinsic:
                gamma: 0.995 # Slightly higher for long-term soccer strategy
                strength: 1.0

        # Self-play for competitive training
        self_play:
            save_steps: 50000 # Save snapshot every 50K steps
            team_change: 200000 # Swap teams every 200K steps
            swap_steps: 10000 # Gradual swap over 10K steps
            window: 5 # Keep 5 snapshots
            play_against_latest_model_ratio: 0.5 # 50% vs current, 50% vs snapshots
            initial_elo: 1200.0

        # Training configuration
        max_steps: 15000000 # 15M additional steps (5-7 hours)
        time_horizon: 1000
        summary_freq: 10000
        keep_checkpoints: 5
        checkpoint_interval: 500000

# Environment parameters for Stage 2
environment_parameters:
    # STAGE 2 MODE: Full soccer (250 obs with real soccer data)
    locomotion_only:
        sampler_type: constant
        sampler_parameters:
            value: 0.0 # Disable locomotion-only mode (soccer observations = real data)

    # Randomize walking speed
    target_walking_speed:
        sampler_type: uniform
        sampler_parameters:
            min_value: 0.5
            max_value: 10.0

    # Progressive curriculum (V10 - starting from transferred locomotion)
    ball_touch:
        curriculum:
            - name: Lesson 2 - Chase Ball (No Kicking)
              # Pure chase: learn movement and ball pursuit in soccer space
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  signal_smoothing: true
                  min_lesson_length: 500
                  threshold: 0.133
              value: 0.35

            - name: Lesson 3 - Enable Kicking (~5M steps)
              # Kicking enabled with stronger rewards for shooting (handled in code)
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  signal_smoothing: true
                  min_lesson_length: 750
                  threshold: 0.333 # 33.3% (5M steps)
              value: 0.5

            - name: Lesson 4 - Full Soccer
              value: 1.0

        # Passing and goalie saves curriculum (enable progressively)
        passing_scale:
            curriculum:
                - name: Lesson 2 - Off (no passing rewards)
                  completion_criteria:
                      measure: progress
                      behavior: WalkerSoccer
                      signal_smoothing: true
                      min_lesson_length: 500
                      threshold: 0.133
                  value: 0.0

                - name: Lesson 3 - On (learn to pass)
                  completion_criteria:
                      measure: progress
                      behavior: WalkerSoccer
                      signal_smoothing: true
                      min_lesson_length: 750
                      threshold: 0.333
                  value: 0.5

                - name: Lesson 4 - Full
                  value: 1.0

        save_scale:
            curriculum:
                - name: Lesson 2 - Off (no save rewards)
                  completion_criteria:
                      measure: progress
                      behavior: WalkerSoccer
                      signal_smoothing: true
                      min_lesson_length: 500
                      threshold: 0.133
                  value: 0.0

                - name: Lesson 3 - On (learn goalie saves)
                  completion_criteria:
                      measure: progress
                      behavior: WalkerSoccer
                      signal_smoothing: true
                      min_lesson_length: 750
                      threshold: 0.333
                  value: 0.5

                - name: Lesson 4 - Full
                  value: 1.0

        # Tunables for passing and shots/saves
        assist_window:
            sampler_type: constant
            sampler_parameters:
                value: 60

        min_pass_dist:
            sampler_type: constant
            sampler_parameters:
                value: 2.5

        shot_align_threshold:
            sampler_type: constant
            sampler_parameters:
                value: 0.7

        shot_range:
            sampler_type: constant
            sampler_parameters:
                value: 9.0

    ball_spawn_radius:
        curriculum:
            - name: Lesson 2 - Chase Ball (Aligned with no-kick)
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  signal_smoothing: true
                  min_lesson_length: 500
                  threshold: 0.133
              value: 1.5

            - name: Lesson 3 - Wider Spawn (~5M steps, kicking enabled)
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  signal_smoothing: true
                  min_lesson_length: 750
                  threshold: 0.333
              value: 2.0

            - name: Lesson 4 - Full Soccer (Center spawn for focused play)
              value: 1.5

    # Fade locomotion reward so soccer signals can dominate in Stage 2
    locomotion_scale:
        sampler_type: constant
        sampler_parameters:
            value: 0.5

# Walker Soccer - Stage 2: Soccer with Transfer Learning (269 obs)
# Soccer observations contain real data (ball position, velocity, team)
# Uses transferred locomotion skills and learns multi-agent soccer

behaviors:
    WalkerSoccer: # Behavior name used for transfer learning
        trainer_type: poca # Multi-agent POCA

        hyperparameters:
            # Lower learning rate for fine-tuning transferred weights
            learning_rate: 0.0001
            learning_rate_schedule: constant

            # Batch and buffer sizes
            batch_size: 8192
            buffer_size: 81920

            # PPO-specific parameters
            beta: 0.005 # Entropy coefficient
            epsilon: 0.2 # PPO clipping
            lambd: 0.95 # GAE lambda
            num_epoch: 3

        # Neural network architecture
        network_settings:
            normalize: true
            hidden_units: 512
            num_layers: 3
            vis_encode_type: simple

        # Reward signals
        reward_signals:
            extrinsic:
                gamma: 0.995 # Slightly higher for long-term soccer strategy
                strength: 1.0

        # Self-play for competitive training
        self_play:
            save_steps: 50000 # Save snapshot every 50K steps
            team_change: 200000 # Swap teams every 200K steps
            swap_steps: 10000 # Gradual swap over 10K steps
            window: 5 # Keep 5 snapshots
            play_against_latest_model_ratio: 0.5 # 50% vs current, 50% vs snapshots
            initial_elo: 1200.0

        # Training configuration
        max_steps: 20000000 # 20M steps for Stage 2 soccer training
        time_horizon: 1000
        summary_freq: 10000
        keep_checkpoints: 40
        checkpoint_interval: 500000

# Environment parameters for Stage 2
environment_parameters:
    # MODE: Full soccer (269 obs with real soccer data)
    locomotion_only:
        sampler_type: constant
        sampler_parameters:
            value: 0.0 # Disable locomotion-only mode (soccer observations = real data)

    # Randomize walking speed
    target_walking_speed:
        sampler_type: uniform
        sampler_parameters:
            min_value: 0.6
            max_value: 6.0

        # Progressive curriculum starting from transferred locomotion
    ball_touch:
        curriculum:
                        - name: Lesson 2 - Chase Ball (No Kicking)
                            # Pure chase: movement and ball pursuit in soccer space
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  signal_smoothing: true
                  min_lesson_length: 500
                  threshold: 0.133
              value: 0.35

                        - name: Lesson 3 - Enable Kicking
                            # Kicking enabled; rewards encourage shooting (handled in code)
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  signal_smoothing: true
                  min_lesson_length: 750
                  threshold: 0.4667 # ~46.67% (7M steps of 15M)
              value: 0.5

            - name: Lesson 4 - Full Soccer
              value: 1.0

    ball_spawn_radius:
        curriculum:
                        - name: Lesson 2 - Chase Ball (Aligned with no-kick)
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  signal_smoothing: true
                  min_lesson_length: 500
                  threshold: 0.133
              value: 1.5

                        - name: Lesson 3 - Wider Spawn (kicking enabled)
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  signal_smoothing: true
                  min_lesson_length: 750
                  threshold: 0.4667
              value: 2.0

                        - name: Lesson 4 - Full Soccer (center-focused spawn)
              value: 1.5

                # Fade locomotion reward so soccer signals dominate
    locomotion_scale:
        curriculum:
            - name: Stage2_FadeStart
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  signal_smoothing: true
                  min_lesson_length: 500
                  threshold: 0.10
              value: 0.5

            - name: Stage2_FadeMore
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  signal_smoothing: true
                  min_lesson_length: 800
                  threshold: 0.4667
                  require_reset: true
              value: 0.4

            - name: Stage2_FullSoccer
              value: 0.15

        # Self-play weight: gradually enable competitive self-play
        # 0.0 = cooperative start, 1.0 = fully competitive
    self_play_weight:
        curriculum:
            - name: Stage2_CooperativePhase
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  signal_smoothing: true
                  min_lesson_length: 1000
                                    threshold: 0.50 # Enable at 50%
              value: 0.0

            - name: Stage2_CompetitivePhase
              value: 1.0

# Walker Soccer Training Configuration V10
# Simplified training closer to Unity's WalkerAgent baseline
# Progressive skill curriculum: Stand → Walk → Chase → Kick → Score

behaviors:
    WalkerSoccer:
        trainer_type: poca # MA-POCA for multi-agent cooperative training

        hyperparameters:
            # Learning rate schedule
            learning_rate: 0.0003
            learning_rate_schedule: constant

            # Batch and buffer sizes
            batch_size: 2048
            buffer_size: 20480

            # PPO-specific parameters
            beta: 0.005 # Entropy coefficient (exploration)
            epsilon: 0.2 # PPO clipping
            lambd: 0.95 # GAE lambda
            num_epoch: 3 # Number of passes through experience

        # Neural network architecture
        network_settings:
            normalize: true # Normalize observations (important for varied inputs)
            hidden_units: 512 # Large network for complex walker control
            num_layers: 3 # Deep network for learning locomotion + soccer
            vis_encode_type: simple # No visual observations currently

        # Reward signals
        reward_signals:
            # Primary extrinsic rewards (goals, ball touches, locomotion)
            extrinsic:
                gamma: 0.99 # Discount factor (long-term planning)
                strength: 1.0

        # Multi-agent specific settings (POCA)
        self_play:
            save_steps: 50000 # Save opponent snapshot every 50k steps
            team_change: 200000 # Change opponent every 200k steps
            swap_steps: 25000 # Swap with past self every 25k steps
            window: 10 # Keep last 10 opponent snapshots
            play_against_latest_model_ratio: 0.5 # 50% train vs latest, 50% vs historical
            initial_elo: 1200.0

        # Training configuration
        max_steps: 40000000 # 40M steps for full curriculum progression
        time_horizon: 1000 # Steps before updating (matches episode length)
        summary_freq: 10000 # Log to TensorBoard every 10k steps
        keep_checkpoints: 10 # Keep last 10 model checkpoints
        checkpoint_interval: 500000 # Save checkpoint every 500k steps

# Environment parameters with multi-phase curriculum learning
# Lessons 0-1: Extended locomotion mastery (10M steps) - ball respawns on touch like original Walker
# Lessons 2-4: Progressive soccer skills - ball stays in play for soccer gameplay
# 1) ball_touch: scales reward influence of ball interaction
# 2) ball_spawn_radius: controls initial distance of ball from center
environment_parameters:
    ball_touch:
        curriculum:
            - name: Lesson0_StandAndBalance
              # Pure balance training - ball is just a touch target (respawns on contact)
              completion_criteria:
                  measure: progress # progress = total_steps / max_steps
                  behavior: WalkerSoccer
                  min_lesson_length: 100 # 100 episodes minimum
                  threshold: 0.125 # 12.5% of max_steps (5M steps)
              value: 0.0
            - name: Lesson1_WalkToTarget
              # Walk toward ball target (respawns on touch like Walker)
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  min_lesson_length: 100 # 100 episodes minimum
                  threshold: 0.25 # 25% (10M steps total for Lesson 0+1)
              value: 0.0
            - name: Lesson2_ChaseBall
              # Ball now stays in play - chase actively
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  min_lesson_length: 800
                  threshold: 0.40 # 40% (16M steps)
              value: 0.35
            - name: Lesson3_KickingEnabled
              # Kick action unlocked! (ball_touch=0.5, kick action now active)
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  min_lesson_length: 1000
                  threshold: 0.625 # 62.5% (25M steps)
              value: 0.5
            - name: Lesson4_GoalScoring
              # Full ball interaction + goal focus (ball_touch=1.0)
              value: 1.0
    ball_spawn_radius:
        curriculum:
            - name: Lesson0_StandAndBalance
              # Ball far away - just a target to walk toward
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  min_lesson_length: 100
                  threshold: 0.125
              value: 3.0
            - name: Lesson1_WalkToTarget
              # Ball medium distance - walk and touch (respawns)
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  min_lesson_length: 100
                  threshold: 0.25
              value: 2.5
            - name: Lesson2_ChaseBall
              # Ball closer - soccer gameplay begins (no respawn on touch)
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  min_lesson_length: 800
                  threshold: 0.40
              value: 2.3
            - name: Lesson3_KickingEnabled
              # Ball very close (kick range)
              completion_criteria:
                  measure: progress
                  behavior: WalkerSoccer
                  min_lesson_length: 1000
                  threshold: 0.625
              value: 1.8
            - name: Lesson4_GoalScoring
              # Ball spawns near agents (competitive)
              value: 1.4

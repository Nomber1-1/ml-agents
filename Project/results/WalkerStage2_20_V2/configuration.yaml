default_settings: null
behaviors:
  WalkerSoccer:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0001
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    checkpoint_interval: 500000
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    init_path: null
    keep_checkpoints: 5
    even_checkpoints: false
    max_steps: 20000000
    time_horizon: 1000
    summary_freq: 10000
    threaded: false
    self_play: null
    behavioral_cloning: null
env_settings:
  env_path: C:\Documents\GitHub\ml-agents\Project\Builds\WalkerStage2_20_V2.exe
  env_args: null
  base_port: 5005
  num_envs: 8
  num_areas: 1
  timeout_wait: 60
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
  no_graphics_monitor: false
environment_parameters:
  locomotion_only:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 4368
          value: 0.0
      name: locomotion_only
      completion_criteria: null
  target_walking_speed:
    curriculum:
    - value:
        sampler_type: uniform
        sampler_parameters:
          seed: 4369
          min_value: 0.5
          max_value: 10.0
      name: target_walking_speed
      completion_criteria: null
  ball_touch:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 4370
          value: 0.35
      name: Lesson 2 - Chase Ball (No Kicking)
      completion_criteria:
        behavior: WalkerSoccer
        measure: progress
        min_lesson_length: 500
        signal_smoothing: true
        threshold: 0.133
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 4371
          value: 0.5
      name: Lesson 3 - Enable Kicking (~5M steps)
      completion_criteria:
        behavior: WalkerSoccer
        measure: progress
        min_lesson_length: 750
        signal_smoothing: true
        threshold: 0.333
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 4372
          value: 1.0
      name: Lesson 4 - Full Soccer
      completion_criteria: null
  ball_spawn_radius:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 4373
          value: 1.5
      name: Lesson 2 - Chase Ball (Aligned with no-kick)
      completion_criteria:
        behavior: WalkerSoccer
        measure: progress
        min_lesson_length: 500
        signal_smoothing: true
        threshold: 0.133
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 4374
          value: 2.0
      name: Lesson 3 - Wider Spawn (~5M steps, kicking enabled)
      completion_criteria:
        behavior: WalkerSoccer
        measure: progress
        min_lesson_length: 750
        signal_smoothing: true
        threshold: 0.333
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 4375
          value: 1.5
      name: Lesson 4 - Full Soccer (Center spawn for focused play)
      completion_criteria: null
  locomotion_scale:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 4376
          value: 0.4
      name: Stage2_FadeStart
      completion_criteria:
        behavior: WalkerSoccer
        measure: progress
        min_lesson_length: 500
        signal_smoothing: true
        threshold: 0.1
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 4377
          value: 0.25
      name: Stage2_FadeMore
      completion_criteria:
        behavior: WalkerSoccer
        measure: progress
        min_lesson_length: 800
        signal_smoothing: true
        threshold: 0.333
        require_reset: true
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 4378
          value: 0.1
      name: Stage2_FullSoccer
      completion_criteria: null
checkpoint_settings:
  run_id: WalkerStage2_20_V2
  initialize_from: null
  load_model: false
  resume: true
  force: false
  train_model: false
  inference: false
  results_dir: results
torch_settings:
  device: null
debug: false

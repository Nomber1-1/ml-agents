default_settings: null
behaviors:
  WalkerSoccer:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0001
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    checkpoint_interval: 500000
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    init_path: results\WalkerStage1_62\WalkerSoccer\checkpoint.pt
    keep_checkpoints: 5
    even_checkpoints: false
    max_steps: 15000000
    time_horizon: 1000
    summary_freq: 10000
    threaded: false
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 10000
      window: 5
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    behavioral_cloning: null
env_settings:
  env_path: C:\Documents\GitHub\ml-agents\Project\Builds\WalkerStage2_20.exe
  env_args: null
  base_port: 5005
  num_envs: 8
  num_areas: 1
  timeout_wait: 60
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
  no_graphics_monitor: false
environment_parameters:
  locomotion_only:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 5316
          value: 0.0
      name: locomotion_only
      completion_criteria: null
  target_walking_speed:
    curriculum:
    - value:
        sampler_type: uniform
        sampler_parameters:
          seed: 5317
          min_value: 0.5
          max_value: 10.0
      name: target_walking_speed
      completion_criteria: null
  ball_touch:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 5318
          value: 0.35
      name: Lesson 2 - Chase Ball (6M steps from transfer start)
      completion_criteria:
        behavior: WalkerSoccer
        measure: progress
        min_lesson_length: 500
        signal_smoothing: true
        threshold: 0.4
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 5319
          value: 0.5
      name: Lesson 3 - Enable Kicking (12M steps total)
      completion_criteria:
        behavior: WalkerSoccer
        measure: progress
        min_lesson_length: 750
        signal_smoothing: true
        threshold: 0.8
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 5320
          value: 1.0
      name: Lesson 4 - Full Soccer
      completion_criteria: null
  ball_spawn_radius:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 5321
          value: 2.3
      name: Lesson 2 - Chase Ball
      completion_criteria:
        behavior: WalkerSoccer
        measure: progress
        min_lesson_length: 500
        signal_smoothing: true
        threshold: 0.4
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 5322
          value: 1.8
      name: Lesson 3 - Enable Kicking
      completion_criteria:
        behavior: WalkerSoccer
        measure: progress
        min_lesson_length: 750
        signal_smoothing: true
        threshold: 0.8
        require_reset: false
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 5323
          value: 1.4
      name: Lesson 4 - Full Soccer
      completion_criteria: null
  locomotion_scale:
    curriculum:
    - value:
        sampler_type: constant
        sampler_parameters:
          seed: 5324
          value: 0.5
      name: locomotion_scale
      completion_criteria: null
checkpoint_settings:
  run_id: WalkerStage2_20
  initialize_from: WalkerStage1_62
  load_model: false
  resume: false
  force: true
  train_model: false
  inference: false
  results_dir: results
torch_settings:
  device: null
debug: false
